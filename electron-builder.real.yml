# Instalador de «Retenia»: el de uso real, sin nada de demostración (docs/arquitectura.md,
# secciones 6 y 7). El identificador y el guid de abajo se fijaron en la Fase 03 y no cambian.
appId: io.github.zeroframe404.retenia
productName: Retenia
executableName: Retenia
copyright: zeroframe404
directories:
  output: release/real
files:
  - out/real/**/*
  - package.json
  # Zod, Drizzle y ts-fsrs ya viajan adentro del archivo principal; de better-sqlite3 solo
  # hace falta lo que usa en Windows de 64 bits.
  - "!node_modules/{drizzle-orm,ts-fsrs,zod}/**"
  - "!node_modules/better-sqlite3/{deps,src}/**"
  - "!node_modules/better-sqlite3/{binding.gyp,README.md}"
  - "!node_modules/better-sqlite3/prebuilds/{darwin,linux,linuxmusl}-*.node"
  - "!node_modules/better-sqlite3/prebuilds/win32-arm64.node"
  # La voz todavía no la usa la versión real: llega con su fase (28). Los escaneos sí (Fase 14):
  # tesseract.js con los datos de español e inglés, como en la versión de prueba.
  - "!node_modules/{sherpa-onnx-node,sherpa-onnx-win-x64,@napi-rs}/**"
  # tesseract.js usa el fetch de Node: su respaldo node-fetch y lo que arrastra no hacen falta
  # (lo que usa jsdom —whatwg-url, tr46, punycode, webidl-conversions, @exodus/bytes— se queda).
  - "!node_modules/{node-fetch,opencollective-postinstall}/**"
  # Lo que tesseract.js usa solo en el navegador.
  - "!node_modules/{zlibjs,idb-keyval}/**"
  # De tesseract.js-core, solo los núcleos que carga en Node (el completo); de los idiomas, solo la
  # versión entera comprimida que usa (no la grande).
  # De tesseract.js no hacen falta su documentación, sus ejemplos ni sus herramientas de desarrollo.
  - "!node_modules/tesseract.js/{docs,examples,scripts,karma.conf.js}/**"
  - "!node_modules/tesseract.js/karma.conf.js"
  - "!node_modules/tesseract.js-core/*.wasm.js"
  - "!node_modules/tesseract.js-core/tesseract-core{,-simd,-relaxedsimd}-lstm.{js,wasm}"
  - "!node_modules/@tesseract.js-data/*/4.0.0/**"
  # Los materiales (Fase 13): de pdf.js viaja solo lo que usa el proceso de materiales (la ventana
  # lleva su parte adentro de su propio archivo), sin el lienzo nativo, que no se usa. mammoth y
  # yauzl viajan enteros.
  - "!node_modules/pdfjs-dist/{build,cmaps,iccs,image_decoders,standard_fonts,types,wasm,web}/**"
  - "!node_modules/pdfjs-dist/legacy/{image_decoders,web}/**"
  - "!node_modules/pdfjs-dist/legacy/build/*.{map,d.mts}"
  - "!node_modules/pdfjs-dist/legacy/build/pdf.{min,sandbox,sandbox.min,worker.min}.mjs"
  - "!node_modules/pdfjs-dist/{webpack.mjs,legacy/webpack.mjs,README.md,CODE_OF_CONDUCT.md}"
  # Las carpetas de ejemplos de las dependencias (sprintf-js, que llega con mammoth, trae una
  # «demo»): no se usan y en la versión real no va nada que se llame así.
  - "!node_modules/**/demo{,/**}"
extraMetadata:
  main: out/real/main/index.js
asar: true
# Fuera del asar: el módulo nativo de la base y tesseract.js, que corre en hilos de Node que leen
# sus archivos del disco, con los datos de español e inglés que vienen en el instalador.
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
  - node_modules/@tesseract.js-data/**
  - node_modules/{wasm-feature-detect,regenerator-runtime,is-url,bmp-js}/**
npmRebuild: false
compression: normal
artifactName: Retenia-instalador-${version}.${ext}
win:
  target:
    - target: nsis
      arch: x64
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Retenia
  deleteAppDataOnUninstall: false
  guid: 07d46497-6f25-492d-966a-9fea67fafae1
  language: "3082"
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
