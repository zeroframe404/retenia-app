# La red de pruebas en la nube, sobre Windows como tu PC.
# - En cada pull request: «npm run verificar:todo» y compilar las dos variantes, con el informe
#   y las trazas de punta a punta como adjuntos.
# - Una vez por semana (y a pedido): todo lo anterior solo, más los cuatro sabotajes.
# Las acciones van fijadas por su huella; al lado, la versión.
name: Red de pruebas

on:
  pull_request:
  schedule:
    # Lunes a las 09:00 UTC (06:00 de Buenos Aires).
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: red-${{ github.ref }}
  cancel-in-progress: true

jobs:
  red:
    name: Red completa y compilación
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Bajar el código con sus tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Node 24.21.0 (el mismo de Electron 44)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm

      - name: Instalar las dependencias del lockfile
        run: npm ci

      - name: Bajar el ejecutable de Electron
        run: node -e "require('electron')"

      - name: Recordar Opengrep entre corridas
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/bin
          key: opengrep-v1.30.2-windows

      - name: Preparar Opengrep (se acepta solo si su huella coincide)
        run: node tools/preparar.mjs

      - name: Red completa (verificar:todo)
        run: npm run verificar:todo

      - name: Compilar las dos variantes
        run: npm run construir

      - name: Repetir los cuatro sabotajes
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          for n in 1 2 3 4; do
            npm run sabotaje -- "$n" || exit 1
          done

      - name: Armar el tablero
        if: always()
        run: node tools/dashboard.mjs --sin-abrir

      - name: Adjuntar el informe, las trazas de punta a punta y el tablero
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informe-de-la-red
          path: |
            .cache/red/corridas/
            .cache/tablero/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 2
